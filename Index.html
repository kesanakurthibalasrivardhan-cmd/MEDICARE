<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare — Multispeciality Hospital & Online OP Booking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C7365'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ============ Design tokens ============ */
:root{
  --paper:#F7F6F1; --card:#FFFFFF; --ink:#182220; --ink2:#57685F; --ink3:#8B9A90;
  --line:#E5E7DF; --line2:#D3D9CC;
  --teal:#0C7365; --teal-strong:#095A4F; --on-teal:#FFFFFF;
  --teal-soft:#E2F1EC; --teal-softer:#F0F6F3;
  --amber:#A05512; --blue:#2F6B8F; --green:#1F7A4D; --red:#B03A31; --gray:#6B7280;
  --soft-book:#E2F1EC; --soft-wait:#FAF0DE; --soft-consult:#E5EFF5; --soft-done:#E3F2E8; --soft-cancel:#F9E9E7; --soft-noshow:#EDEFF0;
  --shadow:0 1px 2px rgba(24,34,32,.05),0 10px 28px -14px rgba(24,34,32,.16);
  --shadow-sm:0 1px 2px rgba(24,34,32,.06);
  --r:14px; --rs:9px;
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0C1311; --card:#131C19; --ink:#E7EDE9; --ink2:#9DB0A7; --ink3:#6E8177;
  --line:#22322B; --line2:#2D4038;
  --teal:#3FBFA8; --teal-strong:#63D6C1; --on-teal:#07211C;
  --teal-soft:#12332C; --teal-softer:#0F2620;
  --amber:#D9A05B; --blue:#7FB2D4; --green:#6FC79A; --red:#E08A81; --gray:#9CA3AF;
  --soft-book:#12332C; --soft-wait:#332613; --soft-consult:#14293A; --soft-done:#12291D; --soft-cancel:#331917; --soft-noshow:#22262A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:600;line-height:1.12;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.lucide{vertical-align:-2px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:var(--teal);color:var(--on-teal)}

/* ============ Primitives ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.18s;white-space:nowrap}
.btn-p{background:var(--teal);color:var(--on-teal)} .btn-p:hover{background:var(--teal-strong);transform:translateY(-1px)}
.btn-g{border-color:var(--line2);background:var(--card)} .btn-g:hover{border-color:var(--teal);color:var(--teal)}
.btn-t{color:var(--teal);padding:10px 8px} .btn-t:hover{gap:12px}
.btn-d{background:var(--soft-cancel);color:var(--red)} .btn-d:hover{filter:brightness(.96)}
.btn.sm,.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{color:var(--teal);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
.input{background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);padding:10px 12px;font-size:14.5px;width:100%;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
textarea.input{resize:vertical;min-height:76px}
.err{color:var(--red);font-size:12.5px;display:none}
.err.show{display:block}
.hint{font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em}
.b-BOOKED{background:var(--soft-book);color:var(--teal)} .b-CHECKED_IN{background:var(--soft-wait);color:var(--amber)}
.b-IN_CONSULT{background:var(--soft-consult);color:var(--blue)} .b-COMPLETED{background:var(--soft-done);color:var(--green)}
.b-CANCELLED{background:var(--soft-cancel);color:var(--red)} .b-NO_SHOW{background:var(--soft-noshow);color:var(--gray)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92em;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--teal-softer);color:var(--teal);font-size:12px;font-weight:600}
.hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink3)}
.empty{padding:36px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pill-tabs button{padding:7px 15px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--card)}
.pill-tabs button.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:16px;flex-shrink:0}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--teal-softer)}

/* ============ Toasts & modal ============ */
#toasts{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;font-weight:500;max-width:360px;animation:tin .25s cubic-bezier(.2,.9,.3,1.2)}
.toast.t-err{background:var(--red);color:#fff}.toast.t-ok{background:var(--teal);color:var(--on-teal)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.ovl{position:fixed;inset:0;background:rgba(12,19,17,.5);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fin .18s}
@keyframes fin{from{opacity:0}}
.modal{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:var(--shadow);animation:min .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal h3{font-size:21px;margin-bottom:4px}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.x{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.x:hover{background:var(--teal-softer);color:var(--ink)}

/* ============ Public chrome ============ */
.pub-head{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pub-nav{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:20px}
.brand .bmark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand small{font-family:'Instrument Sans';font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--ink3);display:block;line-height:1}
.pub-links{display:flex;gap:24px;margin-left:auto;font-size:14.5px;font-weight:500;color:var(--ink2)}
.pub-links a:hover{color:var(--teal)}
.pub-links a.on{color:var(--teal)}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--ink2);background:var(--card);position:relative}
.icon-btn:hover{color:var(--teal);border-color:var(--teal)}
.mob-menu{display:none}
.hero{max-width:1160px;margin:0 auto;padding:64px 24px 40px;display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:18px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--teal)}
.hero h1{font-size:clamp(38px,5vw,58px);margin-bottom:18px}
.hero h1 em{font-style:italic;font-weight:500;color:var(--teal)}
.ecg{display:block;margin:20px 0 4px}
.ecg path{stroke:var(--teal);stroke-width:2;fill:none;stroke-dasharray:340;animation:ecg 3.2s linear infinite}
@keyframes ecg{from{stroke-dashoffset:340}to{stroke-dashoffset:-340}}
.stat-strip{display:flex;gap:0;margin-top:34px;border-top:1px solid var(--line);padding-top:22px;flex-wrap:wrap}
.stat-strip>div{padding-right:34px;margin-right:34px;border-right:1px solid var(--line)}
.stat-strip>div:last-child{border:none;margin:0;padding:0}
.stat-n{font-family:'Fraunces',serif;font-size:27px;font-weight:600}
.desk{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.desk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.live-dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.08em}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--teal-soft)}50%{box-shadow:0 0 0 6px var(--teal-soft)}}
.sect{max-width:1160px;margin:0 auto;padding:72px 24px}
.sect-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;gap:20px;flex-wrap:wrap}
.sect-head h2{font-size:clamp(26px,3.4vw,38px)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.dept-list{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.dept-row{display:flex;align-items:center;gap:18px;padding:22px 18px;border-bottom:1px solid var(--line);transition:.18s;position:relative}
.dept-row:nth-child(odd){border-right:1px solid var(--line);padding-right:34px}
.dept-row:hover{background:var(--teal-softer)}
.dept-row .num{font-family:'Fraunces',serif;font-size:15px;color:var(--ink3);width:26px}
.dept-row .di{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dept-row h3{font-size:18px;font-weight:600}
.dept-row .go{margin-left:auto;color:var(--teal);opacity:0;transform:translateX(-6px);transition:.18s;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dept-row:hover .go{opacity:1;transform:none}
.roster{border-top:1px solid var(--line)}
.doc-row{display:flex;align-items:center;gap:18px;padding:20px 10px;border-bottom:1px solid var(--line);transition:.15s}
.doc-row:hover{background:var(--teal-softer)}
.doc-row .avatar{width:52px;height:52px;border-radius:14px;font-size:18px}
.doc-row h3{font-size:18px}
.doc-row .fee{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.step{padding:26px 22px 6px;border-right:1px dashed var(--line2);position:relative}
.step:last-child{border:none}
.step .sn{font-family:'Fraunces',serif;font-size:44px;color:var(--teal);opacity:.9;font-weight:500}
.step h3{font-size:17px;margin:8px 0 6px}
.quote-big{font-family:'Fraunces',serif;font-size:clamp(22px,3vw,30px);font-style:italic;font-weight:500;line-height:1.35;max-width:820px}
.quote-attr{margin-top:18px;display:flex;align-items:center;gap:12px}
.quotes-sm{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:40px;padding-top:36px;border-top:1px solid var(--line)}
.pub-foot{border-top:1px solid var(--line);margin-top:30px;background:var(--card)}
.foot-grid{max-width:1160px;margin:0 auto;padding:52px 24px 30px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:44px}
.hours-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.foot-bottom{max-width:1160px;margin:0 auto;padding:18px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}

/* ============ Booking wizard ============ */
.stepper{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;max-width:100%}
.stepper span{padding:8px 18px;font-size:13px;font-weight:600;color:var(--ink3);border-right:1px solid var(--line);display:flex;gap:8px;align-items:center;white-space:nowrap}
.stepper span:last-child{border:none}
.stepper span.on{background:var(--teal);color:var(--on-teal)}
.stepper span.done{color:var(--teal)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);cursor:pointer;transition:.15s;text-align:left;width:100%}
.opt:hover{border-color:var(--teal)}
.opt.on{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.datestrip{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}
.dchip{min-width:82px;padding:11px 8px;border:1px solid var(--line2);border-radius:12px;background:var(--card);text-align:center;transition:.15s;flex-shrink:0}
.dchip:hover{border-color:var(--teal)}
.dchip.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.dchip .dw{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.dchip .dd{font-family:'Fraunces',serif;font-size:21px;font-weight:600}
.dchip .dc{font-size:11px;margin-top:2px}
.dchip:disabled{opacity:.4;cursor:not-allowed}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.slot{padding:9px 6px;border-radius:10px;border:1.5px solid var(--line2);text-align:center;font-size:13.5px;font-weight:600;background:var(--card);transition:.13s}
.slot:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.slot.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--ink2)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line2)}

/* ============ App shell ============ */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:4px 8px 18px}
.snav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2);transition:.14s;width:100%;text-align:left}
.snav:hover{background:var(--teal-softer);color:var(--ink)}
.snav.on{background:var(--teal);color:var(--on-teal)}
.snav .lucide{width:17px;height:17px}
.side-foot{margin-top:auto;padding:12px 8px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.main{padding:0 30px 60px;min-width:0}
.topbar{position:sticky;top:0;z-index:90;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.topbar h1{font-size:22px}
.burger{display:none}
.npanel{position:absolute;right:0;top:48px;width:340px;max-height:430px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;z-index:120}
.nitem{display:flex;gap:11px;padding:11px 12px;border-radius:11px;align-items:flex-start}
.nitem:hover{background:var(--teal-softer)}
.nitem.unread{background:var(--teal-softer)}
.nitem .nd{width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:6px;flex-shrink:0}
.nitem.read .nd{background:var(--line2)}
.nbadge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.appt-card{padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);display:flex;gap:16px;align-items:flex-start}
.appt-card.hl{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft),var(--shadow-sm)}
.timeblock{text-align:center;min-width:66px;padding:10px 6px;border-radius:12px;background:var(--teal-softer);flex-shrink:0}
.timeblock .tt{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
.stat-tile{padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stat-tile .sv{font-family:'Fraunces',serif;font-size:31px;font-weight:600;margin-top:2px}
.stat-tile .sl{font-size:12.5px;color:var(--ink2);font-weight:600;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.qlist .qrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.qlist .qrow:last-child{border:none}
.qnum{width:40px;height:40px;border-radius:12px;background:var(--teal);color:var(--on-teal);font-family:'Fraunces',serif;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.filters .field{margin:0;min-width:130px;flex:1}
.filters .field.grow{flex:2}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;font-size:13.5px}
.pager button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.pager button:disabled{opacity:.35}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wday{border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:150px;padding:10px}
.wday.today{border-color:var(--teal)}
.wday h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px}
.wchip{font-size:11.5px;padding:5px 8px;border-radius:8px;margin-bottom:6px;font-weight:600}

<body>

<div id="toasts"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ================================================================
   MediCare — single-file application
   Layers: utils → store (persistent "database") → domain engine
           (slots / booking / queue) → router → views → actions
   ================================================================ */

/* ---------- 1. Utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,12);
const REF_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newRef(){const b=new Uint8Array(8);crypto.getRandomValues(b);const s=Array.from(b).map(x=>REF_CHARS[x%REF_CHARS.length]).join("");return `MC-${s.slice(0,4)}-${s.slice(4)}`;}
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function addDaysStr(ds,n){const [y,m,d]=ds.split("-").map(Number);const dt=new Date(y,m-1,d+n);return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
function dowOf(ds){const [y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).getDay()}
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmt12=t=>{let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dObj(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d)}
const fmtDate=ds=>{const d=dObj(ds);return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONS[d.getMonth()]}`};
const fmtDateLong=ds=>{const d=dObj(ds);return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONS[d.getMonth()]} ${d.getFullYear()}`};
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
const timeAgo=ts=>{const s=(Date.now()-ts)/1e3;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"};
function refreshIcons(){if(window.lucide)lucide.createIcons()}
function toast(msg,type="ok"){const t=document.createElement("div");t.className="toast t-"+type;t.innerHTML=`<i data-lucide="${type==="err"?"alert-circle":type==="info"?"info":"check-circle-2"}"></i><span>${esc(msg)}</span>`;$("#toasts").appendChild(t);refreshIcons();setTimeout(()=>{t.style.opacity="0";t.style.transition=".3s";setTimeout(()=>t.remove(),320)},3600);}
function openModal(html){$("#modal-root").innerHTML=`<div class="ovl" data-ovl><div class="modal">${html}</div></div>`;refreshIcons();$(".ovl").addEventListener("mousedown",e=>{if(e.target.dataset.ovl!==undefined)closeModal()});}
function closeModal(){$("#modal-root").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
async function hashPw(pw,salt){
  if(crypto.subtle){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+"::"+pw));return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
  let h=2166136261;for(const c of salt+"::"+pw){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return("fnv"+(h>>>0).toString(16));
}

/* ---------- 2. Store: persistent browser "database" ---------- */
const DB_KEY="medicare.db.v1";
let db=null;
const save=()=>localStorage.setItem(DB_KEY,JSON.stringify(db));
const ACTIVE=["BOOKED","CHECKED_IN","IN_CONSULT"];
const STATUS_META={BOOKED:["Booked","b-BOOKED"],CHECKED_IN:["Checked in","b-CHECKED_IN"],IN_CONSULT:["In consultation","b-IN_CONSULT"],COMPLETED:["Completed","b-COMPLETED"],CANCELLED:["Cancelled","b-CANCELLED"],NO_SHOW:["No-show","b-NO_SHOW"]};
const badge=st=>`<span class="badge ${STATUS_META[st][1]}">${STATUS_META[st][0]}</span>`;
const userById=id=>db.users.find(u=>u.id===id);


const docById = id => {
  const localDoctor = db.doctors.find(d => d.id === id);

  if (localDoctor) return localDoctor;

  const mongoDoctor = (state.mongoPublicDoctors || [])
    .find(d => d.frontendId === id || d._id === id);

  if (!mongoDoctor) return undefined;

  return {
    ...mongoDoctor,
    id: mongoDoctor.frontendId || mongoDoctor._id,
    userId: mongoDoctor.userId || mongoDoctor.user?._id || "",
    deptId: mongoDoctor.departmentId,
    quals: mongoDoctor.qualification || "General Medicine",
    exp: mongoDoctor.experience ?? 0,
    bio: mongoDoctor.bio || "",
    fee: mongoDoctor.fee || 0
  };
};

const deptById = id => db.departments.find(d => d.id === id);
const apById=id=>db.appointments.find(a=>a.id===id);
function me(){return db.session?userById(db.session.uid):null}
function audit(action,detail,actor){db.audit.unshift({ts:Date.now(),actor:actor||me()?.name||"system",action,detail});db.audit=db.audit.slice(0,400);}
function notify(userId,type,title,body){db.notifications.unshift({id:uid(),userId,type,title,body,ts:Date.now(),read:false});}

/* ---------- 3. Domain engine (the "server logic") ---------- */
function getSettings(){return db.settings}
/* Pure slot calculator — the single source of truth. excludeId lets a
   reschedule recompute availability while ignoring the appointment being moved. */
function slotsFor(doc,dateStr,excludeId){
  const s=getSettings(),slot=s.slotMins,dow=dowOf(dateStr);
  if((doc.leave||[]).includes(dateStr))return{closed:"Doctor on leave"};
  const shifts=(doc.shifts&&doc.shifts[dow])||[];
  if(!shifts.length)return{closed:"Weekly off"};
  const isToday=dateStr===todayStr(),lead=nowMin()+30;
  const booked=db.appointments.filter(a=>a.doctorId===doc.id&&a.date===dateStr&&ACTIVE.includes(a.status)&&a.id!==excludeId);
  const out=[];
  for(const[ws,we]of shifts){
    for(let t=ws;t+slot<=we;t+=slot){
      const clash=booked.some(a=>toMin(a.start)<t+slot&&toMin(a.end)>t);
      const past=isToday&&t<lead;
      out.push({start:fromMin(t),end:fromMin(t+slot),available:!clash&&!past});
    }
  }
  return{slots:out};
}
function nextAvailable(doc){
  const s=getSettings();
  for(let i=0;i<=s.windowDays;i++){
    const ds=addDaysStr(todayStr(),i),r=slotsFor(doc,ds);
    if(r.slots&&r.slots.some(x=>x.available))return{date:ds,slots:r.slots.filter(x=>x.available).slice(0,3)};
  }
  return null;
}
/* Transactional create: re-validates everything at "write time" — the
   frontend slot check is never trusted on its own. */
function createBooking(o){
  const doc=docById(o.doctorId);
  if(!doc)throw"Doctor not found";
  if(o.date<todayStr())throw"Cannot book a date in the past";
  if(o.date>addDaysStr(todayStr(),getSettings().windowDays))throw"Date is outside the booking window";
  const r=slotsFor(doc,o.date);
  if(r.closed)throw"Doctor unavailable — "+r.closed.toLowerCase();
  const slot=(r.slots||[]).find(x=>x.start===o.start);
  if(!slot)throw"That time is not part of the doctor's schedule";
  if(!slot.available)throw"That slot was just taken — please pick another";
  const appt={id:uid(),ref:newRef(),patientId:o.patientId,doctorId:doc.id,deptId:doc.deptId,date:o.date,start:o.start,end:slot.end,
    type:o.type||"New consultation",source:o.source||"online",status:"BOOKED",queue:null,fee:doc.fee,reason:o.reason||"",note:"",
    createdAt:Date.now(),checkinAt:null,history:[{ts:Date.now(),status:"BOOKED",by:o.actor||"patient"}]};
  db.appointments.push(appt);
  const pat=userById(o.patientId);
  notify(o.patientId,"booking","Appointment confirmed",`${doc.name} · ${fmtDate(appt.date)} at ${fmt12(appt.start)} · Ref ${appt.ref}`);
  if(doc.userId)notify(doc.userId,"booking","New appointment booked",`${pat?.name||"A patient"} · ${fmtDate(appt.date)} ${fmt12(appt.start)}`);
  audit("appointment.book",`${appt.ref} · ${doc.name} · ${appt.date} ${appt.start}`,o.actor);
  return appt;
}
function cancelAppt(id,actor){
  const a=apById(id);if(!a)throw"Appointment not found";
  if(!["BOOKED","CHECKED_IN"].includes(a.status))throw"Only active appointments can be cancelled";
  if(a.date===todayStr()&&toMin(a.start)-nowMin()<getSettings().cutoffHours*60)
    throw`Cancellations close ${getSettings().cutoffHours}h before the slot — please contact reception`;
  a.status="CANCELLED";a.history.push({ts:Date.now(),status:"CANCELLED",by:actor});
  const doc=docById(a.doctorId);
  notify(a.patientId,"cancel","Appointment cancelled",`${doc.name} · ${fmtDate(a.date)} ${fmt12(a.start)} · Ref ${a.ref}`);
  if(doc.userId)notify(doc.userId,"cancel","Appointment cancelled",`${fmtDate(a.date)} ${fmt12(a.start)} — slot released`);
  audit("appointment.cancel",a.ref,actor);save();
}
function rescheduleAppt(id,dateStr,start,actor){
  const a=apById(id);if(!a)throw"Appointment not found";
  if(a.status!=="BOOKED")throw"Only booked appointments can be rescheduled";
  if(a.date===todayStr()&&toMin(a.start)-nowMin()<getSettings().cutoffHours*60)
    throw`Rescheduling closes ${getSettings().cutoffHours}h before the slot`;
  const doc=docById(a.doctorId);
  const r=slotsFor(doc,dateStr,a.id); // exclude self from the clash check
  if(r.closed)throw"Doctor unavailable — "+r.closed.toLowerCase();
  const slot=(r.slots||[]).find(x=>x.start===start);
  if(!slot)throw"Invalid slot";if(!slot.available)throw"That slot was just taken — pick another";
  const old=`${fmtDate(a.date)} ${fmt12(a.start)}`;
  a.date=dateStr;a.start=start;a.end=slot.end;a.queue=null;
  a.history.push({ts:Date.now(),status:"BOOKED",by:actor,note:"Rescheduled from "+old});
  notify(a.patientId,"reschedule","Appointment rescheduled",`${doc.name}: now ${fmtDate(a.date)} at ${fmt12(a.start)} (was ${old})`);
  if(doc.userId)notify(doc.userId,"reschedule","Appointment rescheduled",`${fmtDate(a.date)} ${fmt12(a.start)}`);
  audit("appointment.reschedule",`${a.ref} → ${a.date} ${a.start}`,actor);save();
}
function checkIn(id,actor){
  const a=apById(id);if(!a)throw"Appointment not found";
  if(a.status!=="BOOKED")throw"Only booked appointments can be checked in";
  if(a.date!==todayStr())throw"Check-in opens on the appointment day";
  const qs=db.appointments.filter(x=>x.doctorId===a.doctorId&&x.date===a.date&&["CHECKED_IN","IN_CONSULT"].includes(x.status)).map(x=>x.queue||0);
  a.queue=(qs.length?Math.max(...qs):0)+1;a.status="CHECKED_IN";a.checkinAt=Date.now();
  a.history.push({ts:Date.now(),status:"CHECKED_IN",by:actor,note:"Queue #"+a.queue});
  notify(a.patientId,"queue","You're in the queue",`Token #${a.queue} · ${docById(a.doctorId).name} · ${fmt12(a.start)}`);
  audit("appointment.checkin",`${a.ref} → queue #${a.queue}`,actor);save();
}
function setStatus(id,next,actor){
  const a=apById(id);if(!a)throw"Appointment not found";
  const ok={CHECKED_IN:["BOOKED"],IN_CONSULT:["CHECKED_IN"],COMPLETED:["IN_CONSULT","CHECKED_IN"],NO_SHOW:["BOOKED","CHECKED_IN"]};
  if(!(ok[next]||[]).includes(a.status))throw`Cannot move from ${STATUS_META[a.status][0]} to ${STATUS_META[next][0]}`;
  a.status=next;a.history.push({ts:Date.now(),status:next,by:actor});
  notify(a.patientId,"status",`Appointment ${STATUS_META[next][0].toLowerCase()}`,`${docById(a.doctorId).name} · ${fmtDate(a.date)} ${fmt12(a.start)} · Ref ${a.ref}`);
  audit("appointment.status",`${a.ref} → ${next}`,actor);save();
}
function weekDates(){const t=new Date();const mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));return Array.from({length:7},(_,i)=>addDaysStr(todayStr(),i-((t.getDay()+6)%7)))}

/* ---------- 4. Seed: demo hospital, always alive relative to today ---------- */
async function seedDB(){
  const PW=async p=>hashPw(p,"mc");
  const U=async(role,name,email,pass,extra={})=>({id:uid(),role,name,email,salt:"mc",hash:await PW(pass),phone:extra.phone||"",...extra});
  const admin=await U("admin","Dr. Vikram Rao","admin@medicare.dev","Admin@123",{phone:"+91 98400 10001"});
  const recep=await U("reception","Priya Nair","reception@medicare.dev","Reception@123",{phone:"+91 98400 10002"});
  const pats=[
    ["Aarav Sharma","patient@medicare.dev","Patient@123","P-1001","+91 98111 20001",34,"Male"],
    ["Diya Patel","diya.p@example.com","Patient@123","P-1002","+91 98111 20002",27,"Female"],
    ["Rohan Verma","rohan.v@example.com","Patient@123","P-1003","+91 98111 20003",45,"Male"],

  ];
  const patUsers=[];for(const[n,e,p,no,ph,ag,g]of pats)patUsers.push(await U("patient",n,e,p,{patientNo:no,phone:ph,age:ag,gender:g}));
  const docs=[
    ["d1","Meera Iyer","doctor@medicare.dev","Cardiology","MD, DM (Cardiology)",12,900,"Senior interventional cardiologist with a focus on preventive heart care and non-invasive diagnostics.","m.iyer@medicare.dev"],
    ["d2","Arjun Nair","arjun.nair@medicare.dev","Pediatrics","MD (Pediatrics)",8,600,"Paediatrician specialising in newborn care, vaccination schedules and childhood asthma.","a.nair@medicare.dev"],
    ["d3","Kavitha Rao","kavitha.rao@medicare.dev","Dermatology","MD (Dermatology)",10,700,"Clinical dermatologist for acne, eczema, hair fall and cosmetic dermatology consults.","k.rao@medicare.dev"],
    ["d4","S. Venkatesh","s.venkatesh@medicare.dev","Orthopaedics","MS (Orthopaedics)",15,800,"Orthopaedic surgeon — sports injuries, joint replacement and spine consults.","s.venkat@medicare.dev"],
    ["d5","Fatima Sheikh","fatima.sheikh@medicare.dev","Neurology","DM (Neurology)",11,1200,"Neurologist covering headache clinics, epilepsy and stroke follow-up care.","f.sheikh@medicare.dev"],
    ["d6","R. Menon","r.menon@medicare.dev","General Medicine","MD (General Medicine)",18,500,"General physician for fever clinics, diabetes and hypertension management.","r.menon@medicare.dev"],
    ["d7","Anjali Gupta","anjali.gupta@medicare.dev","Gynaecology","MS (OBG)",9,750,"Obstetrician and gynaecologist — antenatal care, PCOS and wellness consults.","a.gupta@medicare.dev"],
    ["d8","Thomas Varghese","thomas.v@medicare.dev","ENT","MS (ENT)",7,650,"ENT surgeon for sinus, hearing and voice disorders.","t.varghese@medicare.dev"],
  ];
  const depNames=["Cardiology","Pediatrics","Dermatology","Orthopaedics","Neurology","General Medicine","Gynaecology","ENT"];
  const depIcons=["heart-pulse","baby","sparkles","bone","brain","stethoscope","flower-2","ear"];
  const depDesc=["Heart health, ECG, echo and preventive cardiology","Child health from newborn to teens","Skin, hair and nail care","Bones, joints and sports injuries","Brain, spine and nerve care","Everyday medicine and chronic care","Women's health at every stage","Ear, nose and throat care"];
  const departments=depNames.map((n,i)=>({id:"dep"+(i+1),name:n,icon:depIcons[i],desc:depDesc[i]}));
  const AM=[[540,780],[840,1020]],EV=[[600,840],[960,1140]],MO=[[540,780]];
  const doctors=docs.map((d,i)=>{
    const shifts=d[2]==="Orthopaedics"?EV:(i%3===2?MO:AM);
    const sh={};for(let k=1;k<=6;k++)sh[k]=k===6?[[540,780]]:shifts;sh[0]=[];
    return{id:d[0],userId:uid(),name:d[1],email:d[8]||d[2],deptId:"dep"+(i+1),quals:d[3],exp:d[4],fee:d[5],bio:d[7],shifts:sh,leave:[],seed:i+3};
  });
  doctors.find(d=>d.id==="d1").email="doctor@medicare.dev";
  const docUsers=[];for(const d of doctors)docUsers.push(await U("doctor",d.name,d.email,"Doctor@123",{phone:"+91 98400 21"+pad(10+doctors.indexOf(d))}));
  doctors.forEach((d,i)=>d.userId=docUsers[i].id);
  const leave1=addDaysStr(todayStr(),(11-dowOf(todayStr())+7)%7+2);doctors[4].leave=[leave1,addDaysStr(leave1,7)];
  const users=[admin,recep,...patUsers,...docUsers];
  const appointments=[];let seq=0;
  const mk=(doc,pat,date,start,status,extra={})=>{
    const slot=getSeedSlotLen();
    appointments.push({id:uid(),ref:newRef(),patientId:pat.id,doctorId:doc.id,deptId:doc.deptId,date,start,end:fromMin(toMin(start)+slot),

  function getSeedSlotLen(){return 15}
  const today=todayStr();

    const dow=dowOf(today),sh=(doc.shifts[dow]&&doc.shifts[dow][0])||null;

      const s0=sh[0],step=getSeedSlotLen();
      const t1=fromMin(s0),t2=fromMin(s0+step),t3=fromMin(s0+step*2),t4=fromMin(s0+step*3),t5=fromMin(s0+step*4),t6=fromMin(s0+step*6),t7=fromMin(s0+step*7);
      mk(doc,patUsers[seq%6],today,t1,"COMPLETED");

function areaChart(data,w=560,h=170){
  if(!data.length)return"";const max=Math.max(...data.map(d=>d.v),1);
  const px=44,pb=26,iw=(w-px-10)/data.length,ih=h-pb-12;
  const pts=data.map((d,i)=>[px+i*iw+iw/2,12+ih-(d.v/max)*ih]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L ${pts[pts.length-1][0].toFixed(1)} ${12+ih} L ${pts[0][0].toFixed(1)} ${12+ih} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Booking trend">
    ${[0,.5,1].map(f=>`<line x1="${px}" x2="${w-10}" y1="${12+ih*f}" y2="${12+ih*f}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${px-8}" y="${15+ih*f}" font-size="10" fill="var(--ink3)" text-anchor="end">${Math.round(max*f)}</text>`).join("")}
    <path d="${area}" fill="var(--teal-soft)"/><path d="${path}" stroke="var(--teal)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--teal)"/><text x="${p[0]}" y="${h-8}" font-size="10" fill="var(--ink3)" text-anchor="middle">${esc(data[i].l)}</text>`).join("")}
  </svg>`;
}
function barChart(items,w=560,h=190){
  const max=Math.max(...items.map(d=>d.v),1),bh=22,gap=10;
  return `<svg viewBox="0 0 ${w} ${items.length*(bh+gap)+8}" style="width:100%;height:auto" role="img" aria-label="Department bookings">
    ${items.map((d,i)=>{const y=i*(bh+gap)+4,bw=Math.max((d.v/max)*(w-190),2);return`<text x="0" y="${y+15}" font-size="12" fill="var(--ink2)">${esc(d.l)}</text>
      <rect x="150" y="${y}" width="${bw}" height="${bh}" rx="6" fill="var(--teal)" opacity="${.45+.55*(d.v/max)}"/>
      <text x="${152+bw+8}" y="${y+15}" font-size="12" font-weight="600" fill="var(--ink)">${d.v}</text>`}).join("")}
  </svg>`;
}

function myAppts(u){return db.appointments.filter(a=>u.role==="patient"?a.patientId===u.id:u.role==="doctor"?a.doctorId===docFor(u)?.id:true).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start))}



function docFor(u) {
  if (!u) return null;

  if (!Array.isArray(db.doctors)) {
    db.doctors = [];
  }

  const userId = String(u.id || u._id || "");

  // First, try the existing local doctor profile.
  let doctor = db.doctors.find(d =>
    d &&
    String(d.userId || d.user?._id || d.user || "") === userId
  );

  // Also support a doctor profile already linked by frontend ID.
  if (!doctor) {
    doctor = db.doctors.find(d =>
      d &&
      String(d.frontendId || "") === String(u.id || "")
    );
  }

 
if (doctor) {
  return doctor;
}

const mongoDoc = state.mongoDoctorProfile;

if (mongoDoc && mongoDoc._id) {
  return {
    ...mongoDoc,
    id: mongoDoc.frontendId || String(mongoDoc._id),
    mongoId: String(mongoDoc._id),
    userId: String(mongoDoc.user?._id || mongoDoc.user || ""),
    name: mongoDoc.user?.name || u.name || "Doctor",
    deptId: mongoDoc.departmentId,
    quals: mongoDoc.qualification || "",
    exp: mongoDoc.experience ?? 0,
    shifts: mongoDoc.shifts || {},
    leave: mongoDoc.leave || [],
    fee: mongoDoc.fee ?? 0
  };
}

return null;
}

  state.mongoDoctorProfileLoading = true;

  try {
    const token = localStorage.getItem("authToken");

    const response = await fetch("http://localhost:5000/api/doctors/me", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Failed to load doctor profile");
    }

    state.mongoDoctorProfile = data.doctor || null;

  } catch (error) {
    console.error("Doctor profile loading error:", error);
    state.mongoDoctorProfile = null;

  } finally {
    state.mongoDoctorProfileLoading = false;
    state.mongoDoctorProfileLoaded = true;
    render();
  }
}

function rSearch(){

    const byRef=db.appointments.filter(a=>a.ref.toLowerCase().includes(ql));
    const patIds=new Set([...pats.map(p=>p.id),...byRef.map(a=>a.patientId)]);

    out=plist.length?plist.map(p=>{

        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${monogram(p.name)}<div><strong>${esc(p.name)}</strong><div class="tiny mono">${esc(p.patientNo)} · ${esc(p.phone)}</div></div>

function aOverview(){
  const t=todayStr();
  const trend=[];for(let i=6;i>=0;i--){const ds=addDaysStr(t,-i);trend.push({l:DAYS[dowOf(ds)]+" "+dObj(ds).getDate(),v:db.appointments.filter(a=>a.date===ds&&a.status!=="CANCELLED").length})}
  const depData=db.departments.map(d=>({l:d.name,v:db.appointments.filter(a=>a.deptId===d.id).length})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const slot=getSettings().slotMins;
  const util=db.doctors.map(doc=>{
    let avail=0,used=0;
    for(let i=0;i<7;i++){const ds=addDaysStr(t,-i);const sh=doc.shifts[dowOf(ds)]||[];
      if(doc.leave?.includes(ds))continue;
      avail+=sh.reduce((s2,w2)=>s2+(w2[1]-w2[0]),0);
      used+=db.appointments.filter(a=>a.doctorId===doc.id&&a.date===ds&&a.status!=="CANCELLED").length*slot;}
    return{doc,pct:avail?Math.min(100,Math.round(used/avail*100)):0,used,avail};
  }).sort((a,b)=>b.pct-a.pct);
  return `<div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
    ${statTile("users",db.users.filter(u=>u.role==="patient").length,"Registered patients")}
    ${statTile("stethoscope",db.doctors.length,"Doctors")}
    ${statTile("calendar-check-2",db.appointments.filter(a=>a.date===t).length,"Today's appointments")}
    ${statTile("hourglass",db.appointments.filter(a=>a.date===t&&a.status==="CHECKED_IN").length,"Waiting now")}
  </div>
  <div class="grid2" style="margin-bottom:20px">
    <div class="card" style="padding:20px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><strong>Appointments — last 7 days</strong><span class="tiny">all statuses except cancelled</span></div>${areaChart(trend)}</div>
    <div class="card" style="padding:20px"><strong style="display:block;margin-bottom:12px">Department-wise bookings</strong>${barChart(depData)}</div>
  </div>
  <div class="grid2">
    <div class="card" style="padding:20px"><strong style="display:block;margin-bottom:8px">Doctor utilisation — last 7 days</strong>
      ${util.map(u2=>`<div class="util-row"><span style="width:150px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u2.doc.name)}</span><div class="bar"><i style="width:${u2.pct}%"></i></div><span class="tiny" style="width:66px;text-align:right">${u2.pct}% · ${Math.round(u2.used/60)}h</span></div>`).join("")}
    </div>
    <div class="card" style="padding:20px"><strong style="display:block;margin-bottom:8px">Recent activity</strong>
      ${db.audit.slice(0,7).map(l=>`<div style="padding:8px 0;border-bottom:1px dashed var(--line2)"><div style="font-size:13px"><strong>${esc(l.actor)}</strong> · <span class="mono" style="font-size:11px;color:var(--teal)">${esc(l.action)}</span></div><div class="tiny">${esc(l.detail)} · ${timeAgo(l.ts)}</div></div>`).join("")||`<p class="tiny">No activity.</p>`}

  </div>`;

async function loadMongoAppointments() {
  if (state.mongoAppointmentsLoading) return;

  state.mongoAppointmentsLoading = true;

  try {
    const response = await fetch("http://localhost:5000/api/appointments", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + localStorage.getItem("authToken")
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Failed to load appointments");
    }

    state.mongoAppointments = data.appointments || [];
    console.log(
  "MongoDB appointments for schedule:",
  state.mongoAppointments
);
  
} catch (error) {

} 
 finally {

  }
}

function aAppts() {
  if (state.mongoAppointments === null) {
    if (!state.mongoAppointmentsLoading) {
      loadMongoAppointments();
    }

    return `<div class="empty">Loading appointments from MongoDB...</div>`;
  }

  const f = state.af;
  const per = 8;

  let list = (state.mongoAppointments || []).slice().sort(
    (a, b) => new Date(b.appointmentDate) - new Date(a.appointmentDate)
  );

  // Filter by status
  if (f.status) {
    list = list.filter(a => a.status === f.status);
  }

  // Filter by department
  if (f.deptId) {
    list = list.filter(a => a.department === f.deptId);
  }

  // Filter by doctor
  if (f.doctorId) {
    list = list.filter(a =>
      a.doctor?._id === f.doctorId ||
      a.doctor?.frontendId === f.doctorId
    );
  }

  // Filter by date range
  if (f.from) {
    list = list.filter(a =>
      new Date(a.appointmentDate) >= new Date(f.from + "T00:00:00")
    );
  }

  if (f.to) {
    list = list.filter(a =>
      new Date(a.appointmentDate) < new Date(f.to + "T23:59:59.999")
    );
  }

  // Search by appointment ID or patient name
  if (f.q) {
    const q = f.q.toLowerCase();

    list = list.filter(a =>
      String(a._id || "").toLowerCase().includes(q) ||
      (a.patient?.name || "").toLowerCase().includes(q)
    );
  }

  const pages = Math.max(1, Math.ceil(list.length / per));
  state.apage = Math.min(state.apage, pages);

  const page = list.slice(
    (state.apage - 1) * per,
    state.apage * per
  );

  return `<div class="filters">
    <div class="field grow">
      <label class="label" for="fq">Search ref / patient</label>
      <input id="fq" class="input" value="${esc(f.q)}" data-change="af-q">

      <select id="fs" class="input" data-change="af-status">
        <option value="">All</option>
        ${Object.keys(STATUS_META).map(s2 =>
          `<option ${f.status === s2 ? "selected" : ""} value="${s2}">${STATUS_META[s2][0]}</option>`
        ).join("")}

    </div>

    <div class="field">
      <label class="label" for="fd">Department</label>
      <select id="fd" class="input" data-change="af-dept">
        <option value="">All</option>
        ${db.departments.map(d =>
          `<option ${f.deptId === d.id ? "selected" : ""} value="${d.id}">${esc(d.name)}</option>`
        ).join("")}
      </select>
    </div>

    <div class="field">
      <label class="label" for="fdoc">Doctor</label>
      <select id="fdoc" class="input" data-change="af-doc">
        <option value="">All</option>
        ${db.doctors.map(d =>
          `<option ${f.doctorId === d.id ? "selected" : ""} value="${d.id}">${esc(d.name)}</option>`
        ).join("")}
      </select>
    </div>

    <div class="field">
      <label class="label" for="ff">From</label>
      <input id="ff" class="input" type="date" value="${esc(f.from)}" data-change="af-from">
    </div>

    <div class="field">
      <label class="label" for="ft">To</label>
      <input id="ft" class="input" type="date" value="${esc(f.to)}" data-change="af-to">
    </div>

    <button class="btn btn-g" data-action="export-csv">
      <i data-lucide="download"></i>CSV
    </button>
  </div>

  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>Appointment ID</th>
          <th>Date · Time</th>
          <th>Patient</th>
          <th>Doctor</th>
          <th>Source</th>
          <th>Fee</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${page.length ? page.map(a => {
          const patientName = a.patient?.name || "—";
          const doctorName = a.doctor?.user?.name || "—";
          const appointmentDate = a.appointmentDate
            ? String(a.appointmentDate).slice(0, 10)
            : "";
          const appointmentTime = a.appointmentTime || "—";
          const status = a.status || "BOOKED";

          return `<tr>
            <td class="mono tiny">${esc(a._id || "—")}</td>

/* ---------- 12. Render dispatcher ---------- */

function render(){
  const seg = route();
  let html = "";

  const page = seg[0];

  if (
    (page === "doctors" || page === "book") &&
    state.mongoPublicDoctors === null &&
    !state.mongoPublicDoctorsLoading
  ) {
    loadPublicMongoDoctors();
  }

  const[u0]=seg;
  if(!u0)html=vHome();
  else if(u0==="departments")html=vDepartments();
  else if(u0==="doctors")html=vDoctors(Object.fromEntries(new URLSearchParams(seg.slice(1).join("/"))));
  else if(u0==="about")html=vAbout();
  else if(u0==="contact")html=vContact();
  else if(u0==="login")html=vLogin();
  else if(u0==="register")html=vRegister();
  else if(u0==="book")html=vBook(Object.fromEntries(new URLSearchParams(seg.slice(1).join("/"))));
  else if(u0==="confirmation")html=vConfirm(seg[1]||"");
  else if(u0==="app")html=vApp(seg[1]);
  else html=vHome();
  $("#app").innerHTML=html;refreshIcons();
}

"wiz-confirm": async function () {
  const w = state.wiz;
  const u = me();

  if (!w.slot) {
    toast("Pick a time slot first", "err");
    return;
  }

  if (!u || u.role !== "patient") {
    toast("Please log in with a patient account to book an appointment.", "err");
    return;
  }

  const doc = docById(w.doctorId);

  if (!doc) {
    toast("Doctor not found.", "err");
    return;
  }

  try {
    const response = await fetch("http://localhost:5000/api/appointments", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + localStorage.getItem("authToken")
      },
      body: JSON.stringify({
        doctor: w.doctorId,
        department: doc.deptId,
        appointmentDate: w.date,
        appointmentTime: w.slot,
        reason: w.reason || ""
      })
    });

    const data = await response.json();

    if (!response.ok) {
      toast(data.message || "Could not book appointment.", "err");
      return;
    }

    // Keep the existing dashboard and confirmation flow working.
    const a = createBooking({
      patientId: u.id,
      doctorId: w.doctorId,
      date: w.date,
      start: w.slot,
      type: w.type,
      reason: w.reason,
      source: "online",
      actor: "patient"
    });

    save();
    state.wiz = {};
    location.hash = "#/confirmation/" + a.ref;
    render();
    toast("Appointment confirmed — ref " + a.ref);
  } catch (error) {
    console.error("Appointment booking failed:", error);
    toast("Could not connect to the booking server. Please try again.", "err");
  }

      `http://localhost:5000/api/appointments/${encodeURIComponent(id)}/status`,

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`

        body: JSON.stringify({ status: next })

    state.mongoAppointments = null;

function fillWiDocs(deptId) {
  const doctorSelect = $("#wdoc");
  const slotSelect = $("#wslot");

  if (!doctorSelect || !slotSelect) return;

  // Include existing local doctors.
  const localDoctors = (db.doctors || []).map(d => ({
    ...d,
    id: d.id,
    deptId: d.deptId
  }));

  // Include doctors loaded from MongoDB.
  const mongoDoctors = (state.mongoPublicDoctors || []).map(d => ({
    ...d,
    id: d.frontendId || d._id,
    deptId: d.departmentId,
    quals: d.qualification || "General Medicine",
    exp: d.experience ?? 0,
    fee: d.fee || 0
  }));

  // Prefer MongoDB records when a doctor exists in both lists.
  const combined = [
    ...localDoctors.filter(local =>
      !mongoDoctors.some(mongo =>
        String(mongo.id) === String(local.id) ||
        (local.frontendId &&
          String(mongo.frontendId) === String(local.frontendId))
      )
    ),
    ...mongoDoctors
  ];

  // Show only doctors from the selected department.
  const list = combined.filter(
    d => String(d.deptId) === String(deptId)
  );

  if (list.length === 0) {
    doctorSelect.innerHTML =
      `<option value="">No doctors available in this department</option>`;
    doctorSelect.disabled = true;
    slotSelect.innerHTML =
      `<option value="">No time slots available</option>`;
    slotSelect.disabled = true;
    return;
  }

  doctorSelect.disabled = false;

  doctorSelect.innerHTML = list.map(d =>
    `<option value="${esc(d.id)}">${esc(d.name)}</option>`
  ).join("");

  slotSelect.disabled = false;
  slotSelect.innerHTML = wiSlots();
}
function wiSlots(){
  const t=todayStr(),ds=$("#wdate").value||t,doc=docById($("#wdoc").value);
  if(!doc)return`<option value="">—</option>`;
  const r=slotsFor(doc,ds);const av=(r.slots||[]).filter(x=>x.available);
  return av.length?av.map(x=>`<option value="${x.start}">${fmt12(x.start)} – ${fmt12(x.end)}</option>`).join(""):`<option value="">No open slots — try another day</option>`;
}

async doc(f) {
  clearErrs(f);

  const name = f.querySelector('[name="name"]').value.trim();
  const email = f.querySelector('[name="email"]').value.trim().toLowerCase();
  const password = f.querySelector('[name="password"]')?.value || "";

  const quals = f.querySelector('[name="quals"]').value.trim();
  const fee = Number(f.querySelector('[name="fee"]').value);
  const exp = Number(f.querySelector('[name="exp"]').value || 0);
  const bio = f.querySelector('[name="bio"]').value.trim();
  const preset = f.querySelector('[name="preset"]')?.value || "am";
  const doctorId = f.dataset.id;
  const isNew = !doctorId;
  const frontendDoctorId = doctorId || uid();

  if (name.length < 2) {
    toast("Enter the doctor's full name.", "err");
    return;
  }

  if (isNew && !email) {
    toast("Enter the doctor's login email.", "err");
    return;
  }

  if (!quals) {
    toast("Enter the doctor's qualifications.", "err");
    return;
  }

  if (!Number.isFinite(fee) || fee < 0 ||
      !Number.isFinite(exp) || exp < 0) {
    toast("Enter a valid fee and experience.", "err");
    return;
  }

  const token = localStorage.getItem("authToken");

  if (!token) {
    toast("Admin login expired. Please sign in again.", "err");
    return;
  }
  try {
    let userId = "";
    let doctorEmail = email;
         
    const oldDoctor = isNew ? null : db.doctors.find(d => d.id === doctorId);

    let shifts;

    if (oldDoctor) {
      shifts = oldDoctor.shifts;
    } else {
      const AM = [[540, 780], [840, 1020]];
      const EV = [[600, 840], [960, 1140]];
      const MO = [[540, 780]];

      const weekly =
        preset === "pm" ? EV :
        preset === "m" ? MO : AM;

      shifts = {};
      for (let day = 1; day <= 6; day++) {
        shifts[day] = day === 6 ? [[540, 780]] : weekly;
      }
      shifts[0] = [];
    }

    if (isNew) {
      const response = await fetch(
        "http://localhost:5000/api/auth/doctors",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            
  name,
  email,
  phone: "",
  password: password,
  frontendId: frontendDoctorId,
  departmentId: deptId,
  qualification: quals,
  experience: exp,
  fee,
  bio,
  shifts,
  leave: []
})
        }
      );

      const data = await response.json();

      if (!response.ok) {
        toast(data.message || "Could not create doctor account.", "err");
        return;
      }

      userId = data.user.id;
      doctorEmail = data.user.email;
    } else {
      const existing = db.doctors.find(d => d.id === doctorId);

      if (!existing) {
        toast("Doctor profile not found. Refresh and try again.", "err");
        return;
      }

      userId = existing.userId;
      doctorEmail = existing.email;
    }
  
    const doctor = {
      ...(oldDoctor || {}),
      id: frontendDoctorId,
      userId,
      name,
      email: doctorEmail,
      deptId,
      quals,
      fee,
      exp,
      bio,
      shifts,
      leave: oldDoctor?.leave || [],
      seed: oldDoctor?.seed ?? 0
    };

    if (oldDoctor) {
      const index = db.doctors.findIndex(d => d.id === doctorId);
      db.doctors[index] = doctor;
    } else {
      db.doctors.push(doctor);
    }

    let localUser = db.users.find(u => u.id === userId);

    if (!localUser) {
      localUser = {
        id: userId,
        role: "doctor",
        name,
        email: doctorEmail,
        phone: "",
        salt: "",
        hash: ""
      };
      db.users.push(localUser);
    } else {
      Object.assign(localUser, {
        name,
        email: doctorEmail,
        role: "doctor"
      });
    }

    audit(isNew ? "doctor.create" : "doctor.update", name, me().name);
    save();
    closeModal();
    toast(isNew
      ? "Doctor account and profile created successfully!"
      : "Doctor profile updated successfully!");
    render();

  } catch (error) {
    console.error("Doctor save failed:", error);
    toast("Could not save the doctor. Check the backend and try again.", "err");
  }
},

  async hours(f) {
    const token = localStorage.getItem("authToken");

    if (!token) {
      toast("Please log in again.", "err");
      return;
    }

    const shifts = {};

    // Sunday is always off.
    shifts[0] = [];

    for (let day = 1; day <= 6; day++) {
      const enabled = f.querySelector(`[name="on${day}"]`).checked;

      if (!enabled) {
        shifts[day] = [];
        continue;
      }

      const start = f.querySelector(`[name="s${day}"]`).value;
      const end = f.querySelector(`[name="e${day}"]`).value;

      if (!start || !end) {
        toast(`Please enter both times for ${DAYS[day]}.`, "err");
        return;
      }

      const toMinutes = value => {
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      };

      const startMinutes = toMinutes(start);
      const endMinutes = toMinutes(end);

      if (startMinutes >= endMinutes) {
        toast(`End time must be after start time on ${DAYS[day]}.`, "err");
        return;
      }

      shifts[day] = [[startMinutes, endMinutes]];
    }

    try {
      const response = await fetch(
        "http://localhost:5000/api/doctors/me/shifts",
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ shifts })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        toast(data.message || "Could not save working hours.", "err");
        return;
      }

      // Update the loaded MongoDB profile immediately.
      if (data.doctor) {
        state.mongoDoctorProfile = data.doctor;
        state.mongoDoctorProfileLoaded = true;
      }

      // Update the local doctor record too, if one exists.
      const u = me();
      const doc = u ? docFor(u) : null;

      if (doc) {
        doc.shifts = shifts;

        if (doc.mongoId || doc._id) {
          state.mongoDoctorProfile = {
            ...(state.mongoDoctorProfile || {}),
            shifts
          };
        } else {
          const localDoc = db.doctors.find(d =>
            d.id === doc.id
          );

          if (localDoc) {
            localDoc.shifts = shifts;
            save();
          }
        }
      }

      toast("Weekly working hours saved successfully!");
      render();

    } catch (error) {
      console.error("Working hours save failed:", error);
      toast("Could not save working hours. Check the backend.", "err");
    }
  },
};

/* ---------- 16. In-app system self-check (mirrors the Vitest suites) ---------- */
function runSelfCheck(){
  const snap=JSON.parse(JSON.stringify(db));
  const results=[];const t=(name,fn)=>{try{fn();results.push([name,true,""])}catch(e){results.push([name,false,String(e)])}};
  const doc=db.doctors[0],pat=db.users.find(u=>u.role==="patient");
  const probe=todayStr()===addDaysStr(todayStr(),0)?addDaysStr(todayStr(),1):todayStr(); // always a future day
  const day=probe;let ds=day;for(let i=0;i<20;i++){const r=slotsFor(doc,ds);if(r.slots&&r.slots.some(s2=>s2.available)){ds;break}ds=addDaysStr(ds,1)}
  let r=slotsFor(doc,ds);
  t("Slot engine returns bookable slots",()=>{if(!r.slots||!r.slots.some(s2=>s2.available))throw"no open slot found"});
  const free=r.slots.find(s2=>s2.available);
  let a1;
  t("Booking a free slot succeeds",()=>{a1=createBooking({patientId:pat.id,doctorId:doc.id,date:ds,start:free.start,source:"online",actor:"test"});if(!a1.ref.startsWith("MC-"))throw"bad ref"});
  t("Double-booking the same slot is rejected",()=>{try{createBooking({patientId:pat.id,doctorId:doc.id,date:ds,start:free.start,source:"online",actor:"test"});throw"booking was allowed"}catch(e){if(e==="booking was allowed")throw e}});
  t("Booked slot disappears from availability",()=>{const rr=slotsFor(doc,ds);if(rr.slots.find(s2=>s2.start===free.start).available)throw"slot still open"});
  t("Weekly off returns closed",()=>{const off=db.doctors.find(d=>Object.values(d.shifts)[0].length===0)||db.doctors.find(d=>!d.shifts[0].length&&d.shifts[0]!==undefined);const sundayD=db.doctors.find(d=>!d.shifts[1].length===false&&d.shifts[2]===undefined);const r2=slotsFor(db.doctors[0],addDaysStr(todayStr(),(7-dowOf(todayStr()))%7||7));if(!(r2.closed||r2.slots))throw"unexpected"});
  const leaveD=addDaysStr(todayStr(),3);
  t("Doctor leave blocks all slots",()=>{db.doctors[1].leave.push(leaveD);const rr=slotsFor(db.doctors[1],leaveD);if(!rr.closed)throw"leave not honoured"});
  t("Cancellation releases the slot",()=>{cancelAppt(a1.id,"test");const rr=slotsFor(doc,ds);if(!rr.slots.find(s2=>s2.start===free.start).available)throw"slot not released"});
  t("Queue numbers increment per doctor",()=>{const qs=[1,2].map(()=>{const rr=slotsFor(doc,todayStr());if(rr.closed||!rr.slots)throw"doctor closed today";const f2=rr.slots.find(s2=>s2.available);if(!f2)throw"no free slot today";const a2=createBooking({patientId:pat.id,doctorId:doc.id,date:todayStr(),start:f2.start,source:"walk_in",actor:"test"});checkIn(a2.id,"test");return a2.queue});if(!(qs[1]>qs[0]))throw"queue did not increment"});
  t("Wrong password is rejected",()=>{const u=db.users.find(x=>x.email==="patient@medicare.dev");if(u.hash===hashPwSync("WrongPass",u.salt))throw"hash matched"});
  t("Patient ownership check on confirmation view",()=>{const other=db.appointments.find(a=>a.patientId!==pat.id);if(!other)throw"no cross appt";const me2=db.users.find(u=>u.role==="patient");const allowed=other.patientId===me2.id;if(allowed)throw"leak"});
  t("Booking outside the window is rejected",()=>{try{createBooking({patientId:pat.id,doctorId:doc.id,date:addDaysStr(todayStr(),db.settings.windowDays+5),start:"10:00",source:"online",actor:"test"});throw"allowed"}catch(e){if(e==="allowed")throw e}});
  db=JSON.parse(JSON.stringify(snap));save();
  return results;
}
